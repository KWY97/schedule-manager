<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 업로드 크기 초과</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="page-container"><section class="card member-detail-card">
    <div class="card-header"><h1 class="card-title">파일 크기를 확인해 주세요</h1></div>
    <p class="error-message" role="alert">파일 업로드에 실패했습니다. 이미지는 파일당 10MB 이하, 한 번에 최대 10장을 선택해 주세요.</p>
    <p class="card-description">Site/HS 등록 또는 수정 화면으로 돌아가 파일을 다시 선택해 주세요.</p>
    <div class="site-detail-actions">
        <a class="secondary-link-button" th:href="@{/admin/sites}">Site 목록으로</a>
        <a class="back-link" th:href="@{/admin/courses}">HC 목록으로</a>
    </div>
</section></main>
</body>
</html>
