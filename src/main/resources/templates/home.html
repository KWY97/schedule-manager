<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Therapeutic Garden</title>

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">
</head>


<body class="page-body">


<!-- ================================
     Header
================================ -->

<header class="home-header">

    <div class="home-header-inner">

        <div>

            <p class="dashboard-eyebrow">
                Therapeutic Garden
            </p>

            <h1 class="home-title">
                치유 공간 모니터링
            </h1>

        </div>


        <nav class="home-login-navigation">

            <a
                    class="home-login-link"
                    th:href="@{/admin/login}">
                관리자 로그인
            </a>

            <a
                    class="home-login-link"
                    th:href="@{/member/login}">
                참가자 로그인
            </a>

        </nav>

    </div>

</header>


<!-- ================================
     Main
================================ -->

<main class="home-map-container">


    <!-- ================================
         왼쪽 정보 패널
    ================================= -->

    <aside class="site-panel">


        <!-- ================================
             Site 기본 정보
        ================================= -->

        <div id="siteInformationPanel">


            <div class="site-panel-header">

                <p class="site-panel-label">
                    SITE
                </p>


                <!--
                    현재는 방배 Site 하나만 존재.

                    나중에 Site가 여러 개 생기면
                    option을 추가해서 Site별 지도로
                    이동하도록 확장할 예정.
                -->

                <select
                        class="site-select"
                        id="siteSelect">

                    <option value="bangbae">
                        방배 Site
                    </option>

                </select>

            </div>


            <!-- Site 이미지 -->
            <div class="site-image-placeholder">

                <span>
                    Site Image
                </span>

            </div>


            <!-- Site 정보 -->
            <div class="site-information">

                <h2>
                    방배 Site
                </h2>

                <p>
                    서울 서초구 서초대로 50
                </p>

            </div>

        </div>


        <!-- ================================
             Healing Spot 상세 정보
        ================================= -->

        <div
                id="spotInformationPanel"
                class="hidden">


            <!-- Site 화면으로 복귀 -->
            <button
                    type="button"
                    class="spot-back-button"
                    id="showSitePanelButton">

                ← Site로 돌아가기

            </button>


            <!-- HS 이름 -->
            <div class="spot-heading">

                <p class="site-panel-label">
                    HEALING SPOT
                </p>


                <h2 id="spotId">
                    HS1
                </h2>


                <p id="spotName">
                    호스타 정원
                </p>

            </div>


            <!-- HS 이미지 -->
            <div class="site-image-placeholder">

                <span>
                    Healing Spot Image
                </span>

            </div>


            <!-- HS 정보 -->
            <div class="spot-information-list">


                <!-- Healing Course -->
                <div class="spot-information-item">

                    <span>
                        Healing Course
                    </span>

                    <strong id="spotCourse">
                        HC-A · 회복 코스
                    </strong>

                </div>


                <!-- Alpha Power -->
                <div class="spot-information-item">

                    <span>
                        Alpha Power
                    </span>

                    <strong>
                        -- %
                    </strong>

                </div>


                <!-- 방문 참가자 -->
                <div class="spot-information-item">

                    <span>
                        방문 참가자
                    </span>

                    <strong>
                        -- 명
                    </strong>

                </div>

            </div>


            <!-- 최근 방문자 -->
            <div class="spot-visitor-section">

                <h3>
                    최근 방문자
                </h3>


                <div class="spot-visitor-placeholder">

                    방문자 정보가 표시될 영역입니다.

                </div>

            </div>

        </div>

    </aside>


    <!-- ================================
         Kakao Map
    ================================= -->

    <section class="map-section">

        <div id="map"></div>

    </section>


</main>


<!-- ================================
     Kakao Maps SDK

     실제 JavaScript Key는
     application.yaml에서 전달받음
================================ -->

<script
        type="text/javascript"
        th:src="|//dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoMapsJavaScriptKey}|">
</script>


<!-- ================================
     홈 지도 JavaScript
================================ -->

<script
        th:src="@{/js/home-map.js}">
</script>


</body>

</html>
