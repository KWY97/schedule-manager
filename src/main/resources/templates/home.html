<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therapeutic Garden</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="page-body">

<header class="home-header">
    <div class="home-header-inner">
        <div>
            <p class="dashboard-eyebrow">Therapeutic Garden</p>
            <h1 class="home-title">치유 공간 모니터링</h1>
        </div>

        <nav class="home-login-navigation">
            <a class="home-login-link"
               th:href="@{/admin/login}">
                관리자 로그인
            </a>

            <a class="home-login-link"
               th:href="@{/member/login}">
                참가자 로그인
            </a>
        </nav>
    </div>
</header>

<main class="home-map-container">

    <aside class="site-panel">

        <div class="site-panel-header">
            <p class="site-panel-label">SITE</p>

            <select class="site-select">
                <option>방배 Site</option>
            </select>
        </div>

        <div class="site-image-placeholder">
            <span>Site Image</span>
        </div>

        <div class="site-information">
            <h2>방배 Site</h2>
            <p>서울 서초구 서초대로 50</p>
        </div>

    </aside>

    <section class="map-section">
        <div id="map"></div>
    </section>

</main>


<script
        type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=1aba5dbe26eaf88b19db4691de1f52cd">
</script>

<script>
    var container = document.getElementById('map');

    // 방배 Site 지도 표시 위치
    var siteMapCenter = new kakao.maps.LatLng(
        37.48385230687292,
        126.98882349727562
    );

    var options = {
        center: siteMapCenter,
        level: 3
    };

    var map = new kakao.maps.Map(container, options);
</script>

</body>
</html>
