<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Therapeutic Garden</title>

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/home-spatial.css}">
</head>


<body class="page-body home-survey-page">


<!-- ================================
     Header
================================ -->

<header th:replace="~{fragments/header :: header}"></header>


<!-- ================================
     Main
================================ -->

<main class="home-map-container">


    <!-- ================================
         왼쪽 정보 패널
    ================================= -->

    <aside class="site-panel">

        <!-- ================================
             Site 기본 정보
        ================================= -->

        <div class="site-panel-header">

            <label class="site-panel-label" for="siteSelect">SITE</label>


            <select
                    class="site-select"
                    id="siteSelect">

                <option
                        th:each="site : ${sites}"
                        th:value="${site.siteId}"
                        th:text="${site.name}"
                        th:data-name="${site.name}"
                        th:data-representative-image-url="${siteImageUrls[site.siteId]}"
                        th:data-address="${site.address}"
                        th:data-latitude="${site.latitude}"
                        th:data-longitude="${site.longitude}"
                        th:data-map-level="${site.mapLevel}">
                </option>

            </select>

        </div>


        <div id="siteInformationPanel">
            <!-- Site 이미지 -->
            <div class="site-image-placeholder">
                <img
                        id="siteImage" hidden alt="Site Image"><span id="siteImageEmpty">등록된 이미지가 없습니다.</span>
            </div>


            <!-- Site 정보 -->
            <div class="site-information">

                <h2 id="siteName"></h2>

                <p id="siteAddress"></p>
                <!-- TEMP: 실제 방문 집계 API 연결 예정 -->
                <p>방문 참가자 <strong>11명</strong> · 데모</p>
                <p id="spaceStatus" role="status"></p>

            </div>

        </div>


        <section id="analysisControls" class="home-analysis-controls" aria-labelledby="analysisControlsTitle">
            <h2 id="analysisControlsTitle">분석 설정</h2>
            <label for="participantSelect">분석 대상</label>
            <select id="participantSelect" class="site-select"><option value="all">전체 평균</option></select>
            <label for="metricSelect">분석 항목</label>
            <select id="metricSelect" class="site-select">
                <option value="stress">VAS 스트레스 척도</option>
                <option value="relaxation">VAS 마음 이완 척도</option>
                <option value="isi">ISI</option>
                <option value="pss">PSS</option>
            </select>
            <button type="button" id="openAnalysisButton" class="primary-button">상세 분석 보기</button>
            <p class="survey-note">TEMP / DEMO · 설문 더미 데이터</p>
        </section>

    </aside>


    <section class="monitoring-space" aria-labelledby="spatialTitle">
        <div class="monitoring-heading">
            <h1 id="spatialTitle">공간 모니터링</h1>
            <button type="button" id="openMapButton" aria-haspopup="dialog">지도 보기</button>
        </div>
        <div class="monitoring-content">
            <p id="monitoringStatus" role="status">공간 정보를 불러오는 중입니다.</p>
            <a id="monitoringSettings" hidden>공간 모니터링 설정</a>
            <div id="monitoringCanvas" class="monitoring-canvas" hidden></div>
        </div>
    </section>
</main>

<div id="spotDetailModal" class="survey-modal" hidden>
    <div class="spot-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="spotDetailTitle" tabindex="-1">
        <header class="monitoring-heading">
            <div><p class="site-panel-label">HEALING SPOT</p><h2 id="spotDetailTitle"></h2><p id="spotDetailCourse"></p></div>
            <button type="button" id="closeSpotDetailButton" aria-label="HS 상세 닫기">×</button>
        </header>
        <div class="spot-detail-content">
            <section aria-label="HS 이미지 갤러리">
                <div class="spot-detail-hero"><img id="spotImage" hidden alt=""><span id="spotImageEmpty"></span></div>
                <div id="spotThumbnails" class="spot-thumbnails" aria-label="이미지 선택" hidden></div>
                <p id="spotGalleryStatus" role="status"></p>
            </section>
            <section class="spot-detail-section" aria-labelledby="spotInfoTitle">
                <h3 id="spotInfoTitle">HS 기본 정보</h3>
                <dl><div><dt>HS code</dt><dd id="spotId"></dd></div><div><dt>HS name</dt><dd id="spotName"></dd></div><div><dt>Healing Course</dt><dd id="spotCourse"></dd></div></dl>
            </section>
            <section class="spot-detail-section" aria-label="기존 설문 분석"><div id="spotAnalysis" aria-live="polite"></div></section>
        </div>
    </div>
</div>

<div id="mapModal" class="survey-modal" hidden>
    <div class="monitoring-map-dialog" role="dialog" aria-modal="true" aria-labelledby="mapModalTitle" tabindex="-1">
        <div class="monitoring-heading">
            <h2 id="mapModalTitle">지도</h2>
            <button type="button" id="closeMapButton" aria-label="지도 닫기">×</button>
        </div>
        <section class="map-section">

            <div id="map"></div>

            <div class="survey-legend" aria-live="polite">
                <p id="surveyLegendTitle" class="survey-legend-title"></p>
                <div class="survey-legend-scale"><span class="survey-legend-label">긍정 방향</span><div class="survey-legend-gradient"></div><span class="survey-legend-label">부정 방향</span></div>
                <p id="surveyLegendRange" class="survey-legend-unit"></p>
                <p id="surveyLegendContext"></p>
            </div>

        </section>
        <p id="mapSelectionStatus" role="status"></p>
    </div>
</div>


<div id="analysisModal" class="survey-modal" hidden>
    <div class="survey-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="analysisModalTitle" tabindex="-1">
        <div class="survey-modal-heading"><h2 id="analysisModalTitle"></h2><button type="button" id="closeAnalysisButton" aria-label="분석 닫기">×</button></div>
        <p class="survey-note">현재 데이터는 화면 시연을 위한 데모용 더미 데이터입니다.</p>
        <p id="analysisModalSite" class="survey-note"></p>
        <div id="analysisModalContent"></div>
    </div>
</div>

<!-- ================================
     Kakao Maps SDK
================================ -->

<script
        type="text/javascript"
        th:src="|//dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoMapsJavaScriptKey}|">
</script>


<!-- ================================
     홈 지도 JavaScript
================================ -->

<script th:src="@{/js/home-survey-analysis.js}"></script>
<script th:src="@{/js/home-spatial.js}"></script>
<script
        th:src="@{/js/home-map.js}">
</script>


</body>

</html>
