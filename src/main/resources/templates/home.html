<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Therapeutic Garden</title>

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">
</head>


<body class="page-body">


<!-- ================================
     Header
================================ -->

<header class="home-header">

    <div class="home-header-inner">

        <div>

            <p class="dashboard-eyebrow">
                Therapeutic Garden
            </p>

            <h1 class="home-title">
                치유 공간 모니터링
            </h1>

        </div>


        <nav class="home-login-navigation">

            <a
                    class="home-login-link"
                    th:href="@{/admin/login}">
                관리자 로그인
            </a>

            <a
                    class="home-login-link"
                    th:href="@{/member/login}">
                참가자 로그인
            </a>

        </nav>

    </div>

</header>


<!-- ================================
     Main
================================ -->

<main class="home-map-container">


    <!-- ================================
         왼쪽 정보 패널
    ================================= -->

    <aside class="site-panel">


        <!-- ================================
             Site 기본 정보
        ================================= -->

        <div id="siteInformationPanel">


            <div class="site-panel-header">

                <p class="site-panel-label">
                    SITE
                </p>


                <select
                        class="site-select"
                        id="siteSelect">

                    <option value="bangbae">
                        방배 Site
                    </option>

                </select>

            </div>


            <!-- Site 이미지 -->
            <div class="site-image-placeholder">

                <span>
                    Site Image
                </span>

            </div>


            <!-- Site 정보 -->
            <div class="site-information">

                <h2>
                    방배 Site
                </h2>

                <p>
                    서울 서초구 서초대로 50
                </p>

            </div>

        </div>


        <!-- ================================
             Healing Spot 상세 정보
        ================================= -->

        <div
                id="spotInformationPanel"
                class="hidden">


            <button
                    type="button"
                    class="spot-back-button"
                    id="showSitePanelButton">

                ← Site로 돌아가기

            </button>


            <div class="spot-heading">

                <p class="site-panel-label">
                    HEALING SPOT
                </p>


                <h2 id="spotId">
                    HS1
                </h2>


                <p id="spotName">
                    호스타 정원
                </p>

            </div>


            <!-- HS 이미지 -->
            <div class="site-image-placeholder">

                <span>
                    Healing Spot Image
                </span>

            </div>


            <!-- HS 상세 정보 -->
            <div class="spot-information-list">


                <!-- Healing Course -->
                <div class="spot-information-item">

                    <span>
                        Healing Course
                    </span>

                    <strong id="spotCourse">
                        HC-A · 회복 코스
                    </strong>

                </div>


                <!-- Alpha Power -->
                <div class="spot-information-item">

                    <span>
                        Alpha Power
                    </span>

                    <strong id="spotAlphaPower">
                        -- %
                    </strong>

                </div>


                <!-- 방문 참가자 -->
                <div class="spot-information-item">

                    <span>
                        방문 참가자
                    </span>

                    <strong>
                        -- 명
                    </strong>

                </div>

            </div>


            <!-- 최근 방문자 -->
            <div class="spot-visitor-section">

                <h3>
                    최근 방문자
                </h3>


                <div class="spot-visitor-placeholder">

                    방문자 정보가 표시될 영역입니다.

                </div>

            </div>

        </div>

    </aside>


    <!-- ================================
         Kakao Map
    ================================= -->

    <section class="map-section">

        <div id="map"></div>

        <!-- Alpha Power 범례 -->
        <div class="alpha-legend">

            <p class="alpha-legend-title">
                Alpha Power
            </p>

            <div class="alpha-legend-scale">

            <span class="alpha-legend-label">
                High
            </span>

                <div class="alpha-legend-gradient"></div>

                <span class="alpha-legend-label">
                Low
            </span>

            </div>

            <p class="alpha-legend-unit">
                단위 결정 필요
            </p>

        </div>

    </section>


</main>


<!-- ================================
     Kakao Maps SDK
================================ -->

<script
        type="text/javascript"
        th:src="|//dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoMapsJavaScriptKey}|">
</script>


<!-- ================================
     홈 지도 JavaScript
================================ -->

<script
        th:src="@{/js/home-map.js}">
</script>


</body>

</html>
