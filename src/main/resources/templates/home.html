<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therapeutic Garden</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="page-body">

<header class="home-header">
    <div class="home-header-inner">

        <div>
            <p class="dashboard-eyebrow">
                Therapeutic Garden
            </p>

            <h1 class="home-title">
                치유 공간 모니터링
            </h1>
        </div>

        <nav class="home-login-navigation">

            <a class="home-login-link"
               th:href="@{/admin/login}">
                관리자 로그인
            </a>

            <a class="home-login-link"
               th:href="@{/member/login}">
                참가자 로그인
            </a>

        </nav>

    </div>
</header>


<main class="home-map-container">

    <aside class="site-panel">


        <!-- ================================
             Site 기본 정보
        ================================= -->

        <div id="siteInformationPanel">

            <div class="site-panel-header">

                <p class="site-panel-label">
                    SITE
                </p>

                <select class="site-select">
                    <option>방배 Site</option>
                </select>

            </div>


            <div class="site-image-placeholder">
                <span>Site Image</span>
            </div>


            <div class="site-information">

                <h2>
                    방배 Site
                </h2>

                <p>
                    서울 서초구 서초대로 50
                </p>

            </div>

        </div>


        <!-- ================================
             Healing Spot 상세 정보
        ================================= -->

        <div id="spotInformationPanel"
             class="hidden">


            <button
                    type="button"
                    class="spot-back-button"
                    id="showSitePanelButton">

                ← Site로 돌아가기

            </button>


            <div class="spot-heading">

                <p class="site-panel-label">
                    HEALING SPOT
                </p>

                <!-- 클릭한 HS 번호 -->
                <h2 id="spotId">
                    HS1
                </h2>

                <!-- 클릭한 HS 이름 -->
                <p id="spotName">
                    호스타 정원
                </p>

            </div>


            <!-- HS 사진 영역 -->
            <div class="site-image-placeholder">

                <span>
                    Healing Spot Image
                </span>

            </div>


            <div class="spot-information-list">


                <!-- Healing Course -->
                <div class="spot-information-item">

                    <span>
                        Healing Course
                    </span>

                    <strong id="spotCourse">
                        HC-A · 회복 코스
                    </strong>

                </div>


                <!-- Alpha Power -->
                <div class="spot-information-item">

                    <span>
                        Alpha Power
                    </span>

                    <strong>
                        -- %
                    </strong>

                </div>


                <!-- 방문 참가자 -->
                <div class="spot-information-item">

                    <span>
                        방문 참가자
                    </span>

                    <strong>
                        -- 명
                    </strong>

                </div>

            </div>


            <!-- 최근 방문자 -->
            <div class="spot-visitor-section">

                <h3>
                    최근 방문자
                </h3>

                <div class="spot-visitor-placeholder">

                    방문자 정보가 표시될 영역입니다.

                </div>

            </div>

        </div>

    </aside>


    <!-- ================================
         Kakao Map
    ================================= -->

    <section class="map-section">

        <div id="map"></div>

    </section>

</main>


<!-- Kakao Maps SDK -->
<script
        type="text/javascript"
        th:src="|//dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoMapsJavaScriptKey}|">
</script>

<!-- 홈 지도 기능 -->
<script th:src="@{/js/home-map.js}"></script>

</body>
</html>
