<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 일정 달력</title>

    <!-- FullCalendar 전체 기능 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>

    <!-- FullCalendar 테마 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/global.js"></script>

    <!-- FullCalendar 한국어 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/locales/ko/global.js"></script>

    <!-- FullCalendar 구조 및 테마 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/theme.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/palettes/purple.css">

    <!-- 프로젝트 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="dashboard-body">


<header class="dashboard-header">

    <div class="dashboard-header-inner">

        <div>

            <p class="dashboard-eyebrow">
                Administrator
            </p>

            <h1 class="dashboard-title">
                관리자 일정 달력
            </h1>

        </div>


        <div class="dashboard-user">

            <div class="user-information">

                <strong>
                    관리자
                </strong>

                <span>
                    전체 참가자의 일정을 확인합니다.
                </span>

            </div>


            <a
                    class="logout-link"
                    th:href="@{/admin}">
                관리자 메인
            </a>

        </div>

    </div>

</header>


<main class="dashboard-container">


    <!-- ================================
         관리자 달력
    ================================= -->
    <section class="calendar-section">

        <div class="section-heading">


            <div>

                <p class="section-label">
                    ADMIN CALENDAR
                </p>

                <h2 class="section-title">
                    전체 일정
                </h2>

            </div>


            <!-- 그룹 범례 -->
            <div class="calendar-legend">


                <div class="calendar-legend-item">

                    <span
                            class="calendar-legend-color group-1-color">
                    </span>

                    <span>
                        1그룹
                    </span>

                </div>


                <div class="calendar-legend-item">

                    <span
                            class="calendar-legend-color group-2-color">
                    </span>

                    <span>
                        2그룹
                    </span>

                </div>


                <div class="calendar-legend-item">

                    <span
                            class="calendar-legend-color group-3-color">
                    </span>

                    <span>
                        3그룹
                    </span>

                </div>


            </div>

        </div>


        <div class="calendar-card full-calendar-card">

            <div id="calendar"></div>

        </div>

    </section>


    <!-- ================================
         DB 일정 데이터
    ================================= -->
    <div
            id="schedule-data"
            hidden>

        <div
                class="schedule-data-item"
                th:each="schedule : ${schedules}"
                th:attr="
                    data-id=${schedule.scheduleId},
                    data-date=${schedule.scheduleDate},
                    data-participant-no=${schedule.member.participantNo},
                    data-group-no=${schedule.member.groupNo}">
        </div>

    </div>

</main>


<!-- ================================
     그룹 클릭 시 표시되는 참가자 목록
================================= -->
<div
        id="admin-group-dropdown"
        class="admin-group-dropdown">

    <div
            id="admin-group-dropdown-title"
            class="admin-group-dropdown-title">
    </div>

    <div
            id="admin-group-dropdown-list"
            class="admin-group-dropdown-list">
    </div>

</div>


<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            const calendarElement =
                document.getElementById(
                    "calendar"
                );


            const scheduleItems =
                document.querySelectorAll(
                    ".schedule-data-item"
                );


            const dropdown =
                document.getElementById(
                    "admin-group-dropdown"
                );


            const dropdownTitle =
                document.getElementById(
                    "admin-group-dropdown-title"
                );


            const dropdownList =
                document.getElementById(
                    "admin-group-dropdown-list"
                );


            /*
             * Thymeleaf 데이터를
             * 일반 JavaScript 객체로 변환
             */
            const schedules =
                Array.from(scheduleItems)
                    .map(function (scheduleItem) {

                        return {

                            id:
                                scheduleItem.dataset.id,

                            date:
                                scheduleItem.dataset.date,

                            participantNo:
                                scheduleItem.dataset.participantNo,

                            groupNo:
                                scheduleItem.dataset.groupNo
                        };

                    });


            /*
             * 날짜 + 그룹 기준으로
             * Schedule들을 묶는다.
             *
             * 예:
             *
             * 2026-08-19 / 1그룹
             * → P001, P002, P003
             */
            const groupedSchedules = {};


            schedules.forEach(function (schedule) {

                const key =
                    `${schedule.date}-${schedule.groupNo}`;


                if (!groupedSchedules[key]) {

                    groupedSchedules[key] = {
                        date: schedule.date,
                        groupNo: schedule.groupNo,
                        schedules: []
                    };
                }


                groupedSchedules[key]
                    .schedules
                    .push(schedule);

            });


            /*
             * 그룹 안에서는
             * 참가자 번호 오름차순
             */
            Object.values(groupedSchedules)
                .forEach(function (group) {

                    group.schedules.sort(
                        function (a, b) {

                            return Number(a.participantNo)
                                - Number(b.participantNo);
                        }
                    );

                });


            /*
             * FullCalendar에 전달할 이벤트 생성
             *
             * 이제 PXXX가 아니라
             * 하루에 그룹별 이벤트만 보여준다.
             */
            const calendarEvents =
                Object.values(groupedSchedules)
                    .map(function (group) {


                        const groupNo =
                            group.groupNo;


                        let groupColor;


                        /*
                         * 1그룹 - 보라
                         */
                        if (groupNo === "1") {

                            groupColor =
                                "#7c3aed";
                        }


                        /*
                         * 2그룹 - 청록
                         */
                        else if (groupNo === "2") {

                            groupColor =
                                "#0d9488";
                        }


                        /*
                         * 3그룹 - 장미
                         */
                        else if (groupNo === "3") {

                            groupColor =
                                "#e11d48";
                        }


                        else {

                            groupColor =
                                "#64748b";
                        }


                        return {

                            /*
                             * 날짜 + 그룹을
                             * 이벤트의 고유 id로 사용
                             */
                            id:
                                `${group.date}-${groupNo}`,


                            /*
                             * 달력에 표시되는 내용
                             */
                            title:
                                `${groupNo}그룹 ▼`,


                            start:
                                group.date,


                            allDay:
                                true,


                            /*
                             * FullCalendar v7 색상
                             */
                            color:
                                groupColor,


                            contrastColor:
                                "#ffffff",


                            /*
                             * 클릭했을 때 사용할
                             * 참가자 일정 목록
                             */
                            extendedProps: {

                                groupNo:
                                    groupNo,

                                groupColor:
                                    groupColor,

                                schedules:
                                    group.schedules
                            }

                        };

                    });


            /*
             * 드롭다운 닫기
             */
            function closeDropdown() {

                dropdown.classList.remove(
                    "show"
                );

            }


            /*
             * FullCalendar 생성
             */
            const calendar =
                new FullCalendar.Calendar(
                    calendarElement,
                    {


                        initialView:
                            "dayGridMonth",


                        initialDate:
                            new Date(),


                        locale:
                            "ko",


                        headerToolbar: {

                            left:
                                "prev,next today",

                            center:
                                "title",

                            right:
                                ""

                        },


                        firstDay:
                            0,


                        events:
                            calendarEvents,


                        displayEventTime:
                            false,


                        /*
                         * 이제 하루 최대 3개
                         *
                         * 1그룹
                         * 2그룹
                         * 3그룹
                         *
                         * 만 표시되므로 모두 보여준다.
                         */
                        dayMaxEvents:
                            false,


                        height:
                            "auto",


                        /*
                         * 그룹 일정 hover용 클래스
                         */
                        eventDidMount:
                            function (info) {

                                info.el.classList.add(
                                    "admin-calendar-event"
                                );

                            },


                        /*
                         * 그룹 클릭
                         */
                        eventClick:
                            function (info) {


                                /*
                                 * 기존 드롭다운 초기화
                                 */
                                dropdownList.innerHTML =
                                    "";


                                const groupNo =
                                    info.event.extendedProps.groupNo;


                                const groupColor =
                                    info.event.extendedProps.groupColor;


                                const groupSchedules =
                                    info.event.extendedProps.schedules;


                                /*
                                 * 드롭다운 제목
                                 */
                                dropdownTitle.textContent =
                                    `${groupNo}그룹`;


                                /*
                                 * 선택한 그룹 색 적용
                                 */
                                dropdown.style.setProperty(
                                    "--group-color",
                                    groupColor
                                );


                                /*
                                 * 참가자별 버튼 생성
                                 */
                                groupSchedules.forEach(
                                    function (schedule) {


                                        const participantNo =
                                            String(
                                                schedule.participantNo
                                            ).padStart(
                                                3,
                                                "0"
                                            );


                                        const participantButton =
                                            document.createElement(
                                                "button"
                                            );


                                        participantButton.type =
                                            "button";


                                        participantButton.classList.add(
                                            "admin-group-participant-button"
                                        );


                                        participantButton.textContent =
                                            `P${participantNo}`;


                                        /*
                                         * PXXX 클릭
                                         * → 기존 일정 상세
                                         */
                                        participantButton.addEventListener(
                                            "click",
                                            function () {

                                                window.location.href =
                                                    `/admin/schedules/${schedule.id}?from=calendar`;

                                            }
                                        );


                                        dropdownList.appendChild(
                                            participantButton
                                        );

                                    }
                                );


                                /*
                                 * 클릭한 그룹 버튼 근처에
                                 * 드롭다운 표시
                                 */
                                dropdown.style.left =
                                    `${info.jsEvent.clientX}px`;


                                dropdown.style.top =
                                    `${info.jsEvent.clientY + 10}px`;


                                dropdown.classList.add(
                                    "show"
                                );

                            }

                    }
                );


            calendar.render();


            /*
             * 드롭다운 내부를 클릭한 경우에는
             * 닫지 않는다.
             */
            dropdown.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                }
            );


            /*
             * 화면 다른 곳 클릭
             * → 드롭다운 닫기
             */
            document.addEventListener(
                "click",
                function (event) {


                    if (
                        !dropdown.contains(event.target)
                        &&
                        !event.target.closest(
                            ".admin-calendar-event"
                        )
                    ) {

                        closeDropdown();

                    }

                }
            );


            /*
             * 이전/다음 달 이동 시
             * 열려 있던 드롭다운 닫기
             */
            calendar.on(
                "datesSet",
                function () {

                    closeDropdown();

                }
            );

        }
    );

</script>

</body>
</html>
