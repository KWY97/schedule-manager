<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body">

<main class="page-container">

    <section class="card list-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>

            <h1 class="card-title">
                참가자 목록
            </h1>

            <p class="card-description">
                현재 등록된 참가자 목록입니다.
            </p>
        </div>

        <div class="table-wrapper">
            <table class="member-table">
                <thead>
                <tr>
                    <th>참가자 번호</th>
                    <th>그룹</th>
                    <th>아이디</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="member : ${members}">
                    <td>
                        <a class="member-detail-link"
                           th:href="@{/admin/members/{memberId}(memberId=${member.memberId})}"
                           th:text="${member.participantNo}">
                        </a>
                    </td>

                    <td>
                <span class="group-label"
                      th:text="|${member.groupNo}그룹|">
                </span>
                    </td>

                    <td th:text="${member.loginId}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/admin}"
           class="back-link">
            관리자 메인으로
        </a>

    </section>

</main>

</body>
</html>
