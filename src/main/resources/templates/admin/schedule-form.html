<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="page-body">

<main class="page-container">

    <section class="card form-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>

            <h1 class="card-title">
                일정 등록
            </h1>

            <p class="card-description">
                참가자에게 날짜별 코스와 스팟 일정을 등록합니다.
            </p>
        </div>


        <form
                class="login-form"
                th:action="@{/admin/schedules/new}"
                th:object="${scheduleForm}"
                method="post"
        >

            <!-- 참가자 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="memberId">
                    참가자
                </label>

                <select
                        class="form-input"
                        id="memberId"
                        th:field="*{memberId}"
                        required
                >
                    <option value="">
                        참가자를 선택해 주세요
                    </option>

                    <option
                            th:each="member : ${members}"
                            th:value="${member.memberId}"
                            th:text="|${member.participantNo}번 · ${member.groupNo}그룹 · ${member.loginId}|">
                    </option>
                </select>

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('memberId')}"
                        th:errors="*{memberId}">
                </p>

            </div>


            <!-- 일정 날짜 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="scheduleDate">
                    일정 날짜
                </label>

                <input
                        class="form-input"
                        type="date"
                        id="scheduleDate"
                        th:field="*{scheduleDate}"
                        required
                >

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('scheduleDate')}"
                        th:errors="*{scheduleDate}">
                </p>

            </div>


            <!-- 코스 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="course">
                    코스
                </label>

                <select
                        class="form-input"
                        id="course"
                        th:field="*{course}"
                        required
                >
                    <option value="">
                        코스를 선택해 주세요
                    </option>

                    <option value="A">
                        HC-A 서측 회복 코스
                    </option>

                    <option value="B">
                        HC-B 동측 감각 코스
                    </option>

                    <option value="C">
                        HC-C 남측 힐링 코스
                    </option>
                </select>

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('course')}"
                        th:errors="*{course}">
                </p>

            </div>


            <!-- 첫 번째 스팟 -->
            <fieldset>

                <legend>
                    첫 번째 스팟
                </legend>

                <div class="form-group">

                    <label
                            class="form-label"
                            for="firstSpotNo">
                        스팟 번호
                    </label>

                    <select
                            class="form-input"
                            id="firstSpotNo"
                            th:field="*{firstSpotNo}"
                            required
                    >
                        <option value="">
                            스팟을 선택해 주세요
                        </option>

                        <option value="1">
                            HS1 호스타 정원
                        </option>

                        <option value="2">
                            HS2 곶자왈원
                        </option>

                        <option value="3">
                            HS3 가든 위스퍼스
                        </option>

                        <option value="4">
                            HS4 콜로네이드 가든
                        </option>

                        <option value="5">
                            HS5 블로썸 가든
                        </option>

                        <option value="6">
                            HS6 극림원
                        </option>
                    </select>

                    <p
                            class="error-message"
                            th:if="${#fields.hasErrors('firstSpotNo')}"
                            th:errors="*{firstSpotNo}">
                    </p>

                </div>


                <div class="form-group">

                    <label
                            class="form-label"
                            for="firstStartTime">
                        시작 시간
                    </label>

                    <input
                            class="form-input"
                            type="time"
                            id="firstStartTime"
                            th:field="*{firstStartTime}"
                            required
                    >

                    <p
                            class="error-message"
                            th:if="${#fields.hasErrors('firstStartTime')}"
                            th:errors="*{firstStartTime}">
                    </p>

                </div>

            </fieldset>


            <!-- 두 번째 스팟 -->
            <fieldset>

                <legend>
                    두 번째 스팟
                </legend>

                <div class="form-group">

                    <label
                            class="form-label"
                            for="secondSpotNo">
                        스팟 번호
                    </label>

                    <select
                            class="form-input"
                            id="secondSpotNo"
                            th:field="*{secondSpotNo}"
                            required
                    >
                        <option value="">
                            스팟을 선택해 주세요
                        </option>

                        <option value="1">
                            HS1 호스타 정원
                        </option>

                        <option value="2">
                            HS2 곶자왈원
                        </option>

                        <option value="3">
                            HS3 가든 위스퍼스
                        </option>

                        <option value="4">
                            HS4 콜로네이드 가든
                        </option>

                        <option value="5">
                            HS5 블로썸 가든
                        </option>

                        <option value="6">
                            HS6 극림원
                        </option>
                    </select>

                    <p
                            class="error-message"
                            th:if="${#fields.hasErrors('secondSpotNo')}"
                            th:errors="*{secondSpotNo}">
                    </p>

                </div>


                <div class="form-group">

                    <label
                            class="form-label"
                            for="secondStartTime">
                        시작 시간
                    </label>

                    <input
                            class="form-input"
                            type="time"
                            id="secondStartTime"
                            th:field="*{secondStartTime}"
                            required
                    >

                    <p
                            class="error-message"
                            th:if="${#fields.hasErrors('secondStartTime')}"
                            th:errors="*{secondStartTime}">
                    </p>

                </div>

            </fieldset>


            <!-- 날씨 정보 -->
            <fieldset>

                <legend>
                    날씨 정보
                </legend>

                <button
                        class="primary-button"
                        type="button"
                        id="weatherButton">
                    날씨 불러오기
                </button>


                <!-- 날씨 -->
                <div class="form-group">

                    <label
                            class="form-label"
                            for="weather">
                        날씨
                    </label>

                    <input
                            class="form-input"
                            type="text"
                            id="weather"
                            th:field="*{weather}"
                            readonly
                    >

                </div>


                <!-- 기온 -->
                <div class="form-group">

                    <label
                            class="form-label"
                            for="temperature">
                        기온(℃)
                    </label>

                    <input
                            class="form-input"
                            type="text"
                            step="0.1"
                            id="temperature"
                            th:field="*{temperature}"
                            readonly
                    >

                </div>


                <!-- 습도 -->
                <div class="form-group">

                    <label
                            class="form-label"
                            for="humidity">
                        습도(%)
                    </label>

                    <input
                            class="form-input"
                            type="text"
                            step="0.1"
                            id="humidity"
                            th:field="*{humidity}"
                            readonly
                    >

                </div>

            </fieldset>


            <!-- 일정 등록 -->
            <button
                    class="primary-button"
                    type="submit">
                일정 등록
            </button>

        </form>


        <a
                class="back-link"
                th:href="@{/admin}">
            관리자 메인으로
        </a>

    </section>

</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const course =
                document.getElementById("course");

        const firstSpotNo =
                document.getElementById("firstSpotNo");

        const secondSpotNo =
                document.getElementById("secondSpotNo");

        const firstStartTime =
                document.getElementById("firstStartTime");

        const secondStartTime =
                document.getElementById("secondStartTime");

        const weatherButton =
                document.getElementById("weatherButton");


        /*
         * 첫 번째 스팟과 두 번째 스팟의
         * 기본 짝을 반환한다.
         *
         * HS1 ↔ HS2
         * HS3 ↔ HS4
         * HS5 ↔ HS6
         */
        function getPairedSpot(firstSpot) {

            if (firstSpot === "1") {
                return "2";
            }

            if (firstSpot === "2") {
                return "1";
            }

            if (firstSpot === "3") {
                return "4";
            }

            if (firstSpot === "4") {
                return "3";
            }

            if (firstSpot === "5") {
                return "6";
            }

            if (firstSpot === "6") {
                return "5";
            }

            return "";
        }


        /*
         * 첫 번째 시작 시간을 기준으로
         * 두 번째 시작 시간을 10분 뒤로 설정한다.
         */
        function setSecondStartTime() {

            if (!firstStartTime.value) {

                secondStartTime.value = "";

                return;
            }


            const [hour, minute] =
                    firstStartTime.value
                            .split(":")
                            .map(Number);


            const firstTime =
                    new Date();

            firstTime.setHours(hour);
            firstTime.setMinutes(minute);
            firstTime.setSeconds(0);


            firstTime.setMinutes(
                    firstTime.getMinutes() + 10
            );


            const secondHour =
                    String(
                            firstTime.getHours()
                    ).padStart(2, "0");


            const secondMinute =
                    String(
                            firstTime.getMinutes()
                    ).padStart(2, "0");


            secondStartTime.value =
                    `${secondHour}:${secondMinute}`;
        }


        /*
         * 코스를 선택하면
         * 기본 스팟과 시작 시간을 자동 설정한다.
         *
         * A → HS1, HS2
         * B → HS3, HS4
         * C → HS5, HS6
         *
         * 첫 번째 시작 시간은 09:00
         * 두 번째 시작 시간은 09:10
         */
        course.addEventListener("change", function () {

            if (course.value === "A") {

                firstSpotNo.value = "1";
                secondSpotNo.value = "2";

            } else if (course.value === "B") {

                firstSpotNo.value = "3";
                secondSpotNo.value = "4";

            } else if (course.value === "C") {

                firstSpotNo.value = "5";
                secondSpotNo.value = "6";

            } else {

                firstSpotNo.value = "";
                secondSpotNo.value = "";

                return;
            }


            /*
             * 코스 선택 시
             * 첫 번째 시간 기본값
             */
            firstStartTime.value =
                    "09:00";


            /*
             * 첫 번째 시간 기준
             * 두 번째 시간 +10분
             */
            setSecondStartTime();
        });


        /*
         * 관리자가 첫 번째 스팟을 직접 변경하면
         * 두 번째 스팟을 짝으로 자동 변경한다.
         */
        firstSpotNo.addEventListener("change", function () {

            secondSpotNo.value =
                    getPairedSpot(
                            firstSpotNo.value
                    );
        });


        /*
         * 첫 번째 시작 시간을 변경하면
         * 두 번째 시작 시간을 10분 뒤로 설정한다.
         *
         * 자동 설정 후에는
         * 관리자가 두 번째 시간을 직접 수정할 수 있다.
         */
        firstStartTime.addEventListener("change", function () {

            setSecondStartTime();
        });


        /*
         * 날씨 불러오기
         *
         * 일정 날짜와 첫 번째 시작 시간을 기준으로
         * 서버의 날씨 조회 API를 호출한다.
         */
        weatherButton.addEventListener("click", async function () {

            const date =
                    document.getElementById(
                            "scheduleDate"
                    ).value;

            const time =
                    firstStartTime.value;


            if (!date || !time) {

                alert(
                        "일정 날짜와 첫 번째 시작 시간을 먼저 입력해 주세요."
                );

                return;
            }


            try {

                const response =
                        await fetch(
                                `/admin/weather?date=${date}&time=${time}`
                        );


                if (!response.ok) {

                    alert(
                            "날씨 정보를 불러오지 못했습니다."
                    );

                    return;
                }


                const data =
                        await response.json();


                document.getElementById(
                        "weather"
                ).value =
                        data.weather;


                document.getElementById(
                        "temperature"
                ).value =
                        data.temperature;


                document.getElementById(
                        "humidity"
                ).value =
                        data.humidity;


            } catch (error) {

                console.error(error);

                alert(
                        "날씨 정보를 불러오는 중 오류가 발생했습니다."
                );
            }

        });

    });
</script>

</body>
</html>
