<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body">

<main class="page-container">
    <section class="card form-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>
            <h1 class="card-title">일정 등록</h1>
            <p class="card-description">
                참가자에게 날짜별 코스와 스팟 일정을 등록합니다.
            </p>
        </div>

        <form
                class="login-form"
                th:action="@{/admin/schedules/new}"
                method="post"
        >
            <div class="form-group">
                <label class="form-label" for="memberId">참가자</label>

                <select class="form-input"
                        id="memberId"
                        name="memberId"
                        required>
                    <option value="">참가자를 선택해 주세요</option>

                    <option th:each="member : ${members}"
                            th:value="${member.memberId}"
                            th:text="|${member.participantNo}번 · ${member.groupNo}그룹 · ${member.loginId}|">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="scheduleDate">일정 날짜</label>

                <input class="form-input"
                       type="date"
                       id="scheduleDate"
                       name="scheduleDate"
                       required>
            </div>

            <div class="form-group">
                <label class="form-label" for="course">코스</label>

                <select class="form-input"
                        id="course"
                        name="course"
                        required>
                    <option value="">코스를 선택해 주세요</option>
                    <option value="A">HC-A 서측 회복 코스</option>
                    <option value="B">HC-B 동측 감각 코스</option>
                    <option value="C">HC-C 남측 힐링 코스</option>
                </select>
            </div>

            <fieldset>
                <legend>첫 번째 스팟</legend>

                <div class="form-group">
                    <label class="form-label" for="firstSpotNo">스팟 번호</label>
                    <select class="form-input"
                            id="firstSpotNo"
                            name="firstSpotNo"
                            required
                    >
                        <option value="">스팟을 선택해 주세요</option>
                        <option value="1">HS1 호스타 정원</option>
                        <option value="2">HS2 곶자왈원</option>
                        <option value="3">HS3 가든 위스퍼스</option>
                        <option value="4">HS4 콜로네이드 가든</option>
                        <option value="5">HS5 블로썸 가든</option>
                        <option value="6">HS6 극림원</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="firstStartTime">시작 시간</label>
                    <input  class="form-input"
                            type="time"
                            id="firstStartTime"
                            name="firstStartTime"
                            required
                    >
                </div>
            </fieldset>

            <fieldset>
                <legend>두 번째 스팟</legend>

                <div class="form-group">
                    <label class="form-label" for="secondSpotNo">스팟 번호</label>
                    <select class="form-input"
                            id="secondSpotNo"
                            name="secondSpotNo"
                            required
                    >
                        <option value="">스팟을 선택해 주세요</option>
                        <option value="1">HS1 호스타 정원</option>
                        <option value="2">HS2 곶자왈원</option>
                        <option value="3">HS3 가든 위스퍼스</option>
                        <option value="4">HS4 콜로네이드 가든</option>
                        <option value="5">HS5 블로썸 가든</option>
                        <option value="6">HS6 극림원</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="secondStartTime">시작 시간</label>
                    <input class="form-input"
                            type="time"
                            id="secondStartTime"
                            name="secondStartTime"
                            required
                    >
                </div>
            </fieldset>

            <button class="primary-button" type="submit">일정 등록</button>
        </form>

        <a class="back-link"
           th:href="@{/admin}">
           관리자 메인으로
        </a>

    </section>
</main>

</body>
</html>
