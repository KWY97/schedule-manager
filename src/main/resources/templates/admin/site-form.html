<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin-images.css}">
</head>
<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="page-container">
    <section class="card form-card place-image-card">
        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>
            <h1 class="card-title">사이트 등록</h1>
        </div>
        <p class="error-message" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <p class="image-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
        <form id="place-form" enctype="multipart/form-data" class="login-form site-form" th:action="@{/admin/sites/new}" th:object="${siteForm}" method="post">
            <p class="error-message" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            <div th:fragment="siteFields">
            <div class="form-group">
                <label class="form-label" for="name">사이트명</label>
                <input class="form-input" id="name" th:field="*{name}" type="text" maxlength="255" required>
                <p class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>
            <div class="form-group">
                <label class="form-label" for="address">주소</label>
                <div class="site-location-search">
                    <input class="form-input" id="address" th:field="*{address}" type="text" maxlength="255" readonly required>
                    <button class="site-location-search-button" id="site-location-search" type="button" aria-haspopup="dialog" aria-controls="site-postcode-modal">주소 검색</button>
                </div>
                <p class="error-message" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
            </div>
            <dialog class="site-postcode-modal" id="site-postcode-modal" aria-modal="true" aria-labelledby="site-postcode-title">
                <div class="site-postcode-header">
                    <h2 id="site-postcode-title">주소 검색</h2>
                    <button class="site-postcode-close" id="site-postcode-close" type="button" aria-label="주소 검색 닫기" autofocus>×</button>
                </div>
                <p class="site-postcode-status" id="site-postcode-status" role="status" aria-atomic="true"></p>
                <div class="site-postcode-embed" id="site-postcode-embed"></div>
            </dialog>
            <section class="site-location-section" aria-labelledby="site-location-heading">
                <h2 class="form-label" id="site-location-heading">지도에서 위치 확인</h2>
                <p class="site-location-note">지도 클릭으로 세부 위치를 조정할 수 있습니다.</p>
                <p class="site-location-status" id="site-location-status" role="status" aria-atomic="true"></p>
                <div class="site-location-map" id="site-location-map" aria-label="Site 위치 지도"></div>
            </section>
            <input id="latitude" th:field="*{latitude}" type="hidden">
            <input id="longitude" th:field="*{longitude}" type="hidden">
            <p class="error-message" th:if="${#fields.hasErrors('latitude') or #fields.hasErrors('longitude')}">주소를 검색하거나 지도를 클릭해 위치를 다시 지정해 주세요.</p>
            <div class="form-group">
                <label class="form-label" for="mapLevel">지도 레벨</label>
                <input class="form-input" id="mapLevel" aria-describedby="site-map-level-help" th:field="*{mapLevel}" type="number" min="1" max="14" step="1" required>
                <p class="site-location-note" id="site-map-level-help">숫자가 작을수록 지도가 더 확대되어 표시됩니다.</p>
                <p class="error-message" th:if="${#fields.hasErrors('mapLevel')}" th:errors="*{mapLevel}"></p>
            </div>
            </div>
            <section th:replace="~{fragments/admin-images :: editor}"></section>
            <button class="primary-button" type="submit">사이트 등록</button>
        </form>
        <a class="back-link" th:href="@{/admin/sites}">사이트 목록으로</a>
    </section>
</main>
<script th:src="|//dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoMapsJavaScriptKey}&libraries=services|"></script>
<script defer src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:src="@{/js/admin-site-map.js}"></script>
<script th:src="@{/js/admin-image-form.js}"></script>
</body>
</html>
