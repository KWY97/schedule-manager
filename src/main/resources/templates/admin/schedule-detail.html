<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 상세 정보</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body">

<main class="page-container">
    <section class="card member-detail-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>
            <h1 class="card-title">일정 상세 정보</h1>
            <p class="card-description">
                선택한 참가자의 일정과 스팟 순서를 확인합니다.
            </p>
        </div>

        <dl class="member-detail-list">
            <div class="member-detail-item">
                <dt>일정 날짜</dt>
                <dd th:text="${schedule.scheduleDate}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>이름</dt>
                <dd th:text="${schedule.member.name != null ? schedule.member.name : '-'}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>그룹</dt>
                <dd th:text="|${schedule.member.groupNo}그룹|"></dd>
            </div>

            <div class="member-detail-item">
                <dt>아이디</dt>
                <dd th:text="${schedule.member.loginId}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>코스</dt>
                <dd th:text="|코스 ${schedule.course}|"></dd>
            </div>

            <div class="member-detail-item">
                <dt>날씨</dt>
                <dd th:text="${schedule.weather != null ? schedule.weather : '-'}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>기온(℃)</dt>
                <dd th:text="${schedule.temperature != null ? schedule.temperature + '℃' : '-'}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>습도(%)</dt>
                <dd th:text="${schedule.humidity != null ? schedule.humidity + '%' : '-'}"></dd>
            </div>
        </dl>

        <section class="schedule-spot-section">
            <div class="schedule-spot-header">
                <h2>스팟 일정</h2>
                <p>방문 순서에 따라 표시됩니다.</p>
            </div>

            <div class="schedule-list">
                <article
                        class="schedule-item"
                        th:each="spot : ${scheduleSpots}">

                    <span
                            class="schedule-sequence"
                            th:text="${spot.sequence}">
                    </span>

                    <div>
                        <strong
                                class="schedule-time"
                                th:text="${spot.startTime}">
                        </strong>

                        <p
                                class="schedule-spot"
                                th:switch="${spot.spotNo}">

                            <span th:case="1">
                                HS1 호스타 정원
                            </span>
                            <span th:case="2">
                                HS2 곶자왈원
                            </span>
                            <span th:case="3">
                                HS3 가든 위스퍼스
                            </span>
                            <span th:case="4">
                                HS4 콜로네이드 가든
                            </span>
                            <span th:case="5">
                                HS5 블로썸 가든
                            </span>
                            <span th:case="6">
                                HS6 극림원
                            </span>
                            <span th:case="*">
                                -
                            </span>
                        </p>

                    </div>
                </article>
            </div>

            <p
                    class="empty-message"
                    th:if="${#lists.isEmpty(scheduleSpots)}">
                등록된 스팟 일정이 없습니다.
            </p>
        </section>

        <div class="detail-action-list">

            <a
                    class="primary-button"
                    th:href="@{/admin/schedules/{scheduleId}/edit(
                        scheduleId=${schedule.scheduleId},
                        from=${from}
                    )}">
                일정 수정
            </a>

            <form
                    class="delete-form"
                    th:action="@{/admin/schedules/{scheduleId}/delete(scheduleId=${schedule.scheduleId})}"
                    method="post"
                    onsubmit="return confirm('정말 이 일정을 삭제하시겠습니까?');"
            >
                <button
                        class="delete-button"
                        type="submit">
                    일정 삭제
                </button>
            </form>


            <!-- 일정 목록에서 상세로 들어온 경우 -->
            <a
                    class="secondary-link-button"
                    th:if="${from != 'calendar'}"
                    th:href="@{/admin/schedules}">
                일정 목록으로
            </a>


            <!-- 달력에서 상세로 들어온 경우 -->
            <a
                    class="secondary-link-button"
                    th:if="${from == 'calendar'}"
                    th:href="@{/admin/schedules/calendar}">
                달력으로
            </a>

        </div>
    </section>
</main>

</body>
</html>
