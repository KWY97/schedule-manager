<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-body service-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="dashboard-container admin-list-container">
    <nav class="admin-page-navigation" aria-label="관리자 화면 이동">
        <a class="logout-link" th:href="@{/admin}">관리자 메인</a>
    </nav>

    <header class="section-heading">
        <div>
            <p class="section-label">ADMINISTRATOR</p>
            <h1 class="section-title">사이트 목록</h1>
        </div>
    </header>

    <section class="card" aria-label="사이트 목록 콘텐츠">
        <p class="error-message" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <p role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
        <div class="schedule-list-toolbar">
            <a class="primary-link-button schedule-create-button" th:href="@{/admin/sites/new}">사이트 등록</a>
        </div>
        <div class="table-wrapper">
            <table class="member-table">
                <thead><tr><th>ID</th><th>사이트명</th><th>주소</th><th>지도 레벨</th><th>상세</th></tr></thead>
                <tbody>
                <tr th:each="site : ${siteList}">
                    <td th:text="${site.siteId}"></td>
                    <td th:text="${site.name}"></td>
                    <td th:text="${site.address}"></td>
                    <td th:text="${site.mapLevel}"></td>
                    <td><a class="member-detail-link" th:href="@{/admin/sites/{siteId}(siteId=${site.siteId})}">상세보기</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="empty-message" th:if="${#lists.isEmpty(siteList)}">등록된 사이트가 없습니다.</p>
    </section>
</main>
</body>
</html>
