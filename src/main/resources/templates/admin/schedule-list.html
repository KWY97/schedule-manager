<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>일정 목록</title>

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">
</head>

<body class="page-body">

<main class="page-container">

    <section class="card list-card">

        <!-- ================================
             페이지 제목
        ================================= -->
        <div class="card-header">

            <p class="card-eyebrow">
                Administrator
            </p>

            <h1 class="card-title">
                일정 목록
            </h1>

            <p class="card-description">
                현재 등록된 참가자별 일정을 확인합니다.
            </p>

        </div>


        <!-- ================================
             정렬 / 일정 등록
        ================================= -->
        <div class="schedule-list-toolbar">

            <!-- 정렬 -->
            <form
                    class="schedule-sort-form"
                    th:action="@{/admin/schedules}"
                    method="get">

                <label
                        for="sort"
                        class="schedule-sort-label">
                    정렬
                </label>

                <select
                        id="sort"
                        name="sort"
                        class="schedule-sort-select">

                    <!-- 일정 날짜순 -->
                    <option
                            value="date"
                            th:selected="${sort == 'date'}">
                        일정 날짜순
                    </option>

                    <!-- 그룹순 -->
                    <option
                            value="group"
                            th:selected="${sort == 'group'}">
                        그룹순
                    </option>

                </select>

                <button
                        type="submit"
                        class="schedule-sort-button">
                    정렬
                </button>

            </form>


            <!-- 새 일정 등록 -->
            <a
                    class="primary-link-button schedule-create-button"
                    th:href="@{/admin/schedules/new}">
                새 일정 등록
            </a>

        </div>


        <!-- ================================
             일정 목록
        ================================= -->
        <div class="table-wrapper">

            <table class="member-table">

                <thead>

                <tr>
                    <th>일정 날짜</th>
                    <th>이름</th>
                    <th>그룹</th>
                    <th>아이디</th>
                    <th>코스</th>
                    <th>날씨</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="schedule : ${schedules}">

                    <!-- 일정 날짜 / 상세 페이지 이동 -->
                    <td>

                        <a
                                class="member-detail-link"
                                th:href="@{/admin/schedules/{scheduleId}(
                                    scheduleId=${schedule.scheduleId}
                                )}"
                                th:text="${schedule.scheduleDate}">
                        </a>

                    </td>


                    <!-- 이름 -->
                    <td
                            th:text="${schedule.member.name != null
                                ? schedule.member.name
                                : '-'}">
                    </td>


                    <!-- 그룹 -->
                    <td th:text="|${schedule.member.groupNo}그룹|">
                    </td>


                    <!-- 로그인 아이디 -->
                    <td th:text="${schedule.member.loginId}">
                    </td>


                    <!-- 코스 -->
                    <td>

                        <span
                                class="course-label"
                                th:text="|코스 ${schedule.course}|">
                        </span>

                    </td>


                    <!-- 날씨 -->
                    <td
                            th:text="${schedule.weather != null
                                ? schedule.weather
                                : '-'}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <!-- ================================
             등록된 일정이 없는 경우
        ================================= -->
        <p
                class="empty-message"
                th:if="${#lists.isEmpty(schedules)}">
            등록된 일정이 없습니다.
        </p>


        <!-- ================================
             관리자 메인
        ================================= -->
        <a
                class="back-link"
                th:href="@{/admin}">
            관리자 메인으로
        </a>

    </section>

</main>

</body>
</html>
