<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC 관리</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="page-body admin-course-page service-page">

<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container">
    <section class="card form-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>
            <h1 class="card-title"
                th:text="${courseId == null ? 'HC 등록' : 'HC 수정'}">
            </h1>
        </div>

        <form class="login-form site-form"
              th:object="${healingCourseForm}"
              method="post"
              th:action="${courseId == null}
                    ? @{/admin/courses/new}
                    : @{/admin/courses/{id}/edit(id=${courseId})}">

            <p class="error-message"
               role="alert"
               th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">
            </p>

            <div>

                <!-- 사이트 -->
                <div class="form-group">
                    <label class="form-label" for="siteId">사이트</label>

                    <select class="form-input"
                            th:field="*{siteId}"
                            required>

                        <option value="">사이트를 선택해 주세요</option>

                        <option th:each="site : ${courseSites}"
                                th:value="${site.siteId}"
                                th:text="${site.name}"
                                th:attr="
                                    data-latitude=${site.latitude},
                                    data-longitude=${site.longitude},
                                    data-map-level=${site.mapLevel}">
                        </option>
                    </select>

                    <p class="error-message"
                       th:errors="*{siteId}">
                    </p>
                </div>

                <!-- HC 코드 -->
                <div class="form-group">
                    <label class="form-label" for="code">HC 코드</label>

                    <input class="form-input"
                           th:field="*{code}"
                           type="text"
                           maxlength="255"
                           required>

                    <p class="error-message"
                       th:errors="*{code}">
                    </p>
                </div>

                <!-- 코스명 -->
                <div class="form-group">
                    <label class="form-label" for="name">코스명</label>

                    <input class="form-input"
                           th:field="*{name}"
                           type="text"
                           maxlength="255"
                           required>

                    <p class="error-message"
                       th:errors="*{name}">
                    </p>
                </div>

                <!-- 반경 -->
                <div class="form-group">
                    <label class="form-label" for="radius">반경 (m)</label>

                    <input class="form-input"
                           th:field="*{radius}"
                           aria-describedby="course-radius-help"
                           type="number"
                           step="any"
                           min="0">

                    <p class="card-description"
                       id="course-radius-help">
                        반경은 선택 사항입니다.
                    </p>

                    <p class="error-message"
                       th:errors="*{radius}">
                    </p>
                </div>

                <!-- 지도에서 관리하는 중심 좌표 -->
                <input th:field="*{centerLatitude}" type="hidden">
                <input th:field="*{centerLongitude}" type="hidden">

                <p class="error-message"
                   th:if="${#fields.hasErrors('centerLatitude') or #fields.hasErrors('centerLongitude')}">
                    지도를 클릭해 코스의 중심 위치를 다시 지정해 주세요.
                </p>

            </div>

            <!-- 지도 -->
            <section class="course-map-section"
                     aria-labelledby="course-map-heading">

                <h2 id="course-map-heading"
                    class="form-label">
                    지도에서 영역 설정
                </h2>

                <p class="card-description course-map-note">
                    지도를 클릭해 코스의 중심 위치를 지정하고, 반경을 입력해 영역을 설정할 수 있습니다.
                </p>

                <p id="course-map-status"
                   class="card-description"
                   role="status">
                </p>

                <div id="course-map"
                     class="course-map"
                     aria-label="HealingCourse 중심과 반경 미리보기">
                </div>

            </section>

            <button class="primary-button"
                    type="submit"
                    th:text="${courseId == null ? 'HC 등록' : 'HC 수정'}">
            </button>

        </form>

        <nav class="course-footer"
             aria-label="HealingCourse 목록 이동">

            <a class="back-link"
               th:href="@{/admin/courses(siteId=${healingCourseForm.siteId})}">
                HC 목록으로
            </a>

        </nav>

    </section>
</main>

<script th:src="|//dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoMapsJavaScriptKey}|"></script>
<script th:src="@{/js/admin-course-map.js}"></script>

</body>
</html>
