<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 상세 정보</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body">

<main class="page-container">
    <section class="card member-detail-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>
            <h1 class="card-title">참가자 상세 정보</h1>
            <p class="card-description">
                선택한 참가자의 등록 정보를 확인합니다.
            </p>
        </div>

        <dl class="member-detail-list">
            <div class="member-detail-item">
                <dt>참가자 번호</dt>
                <dd th:text="${member.participantNo}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>그룹</dt>
                <dd th:text="${member.groupNo}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>로그인 아이디</dt>
                <dd th:text="${member.loginId}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>이름</dt>
                <dd th:text="${member.name != null ? member.name : '-'}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>전화번호</dt>
                <dd th:text="${member.phone != null ? member.phone : '-'}"></dd>
            </div>
        </dl>

        <div class="detail-action-list">
            <a class="primary-link-button"
               th:href="@{/admin/members/{memberId}/edit(memberId=${member.memberId})}">
                참가자 정보 수정
            </a>

            <form
                class="delete-form"
                th:action="@{/admin/members/{memberId}/delete(memberId=${member.memberId})}"
                method="post"
                onsubmit="return confirm('참가자를 삭제하면 해당 참가자의 모든 일정도 함께 삭제됩니다. 정말 삭제하시겠습니까?')"
            >
                <button
                    class="delete-button"
                    type="submit"
                >
                    참가자 삭제
                </button>

            </form>

            <a class="secondary-link-button"
               th:href="@{/admin/members}">
                참가자 목록으로
            </a>
        </div>

    </section>
</main>

</body>
</html>
