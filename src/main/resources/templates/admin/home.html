<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 메인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body">

<main class="page-container">

    <section class="card home-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>

            <h1 class="card-title">
                관리자 메인
            </h1>

            <p class="card-description">
                사이트, 참가자와 일정을 관리합니다.
            </p>
        </div>

        <nav class="admin-menu" aria-label="관리 기능">

            <a th:href="@{/admin/sites}"
               class="secondary-link-button">
                사이트 관리
            </a>

            <a th:href="@{/admin/members}"
               class="secondary-link-button">
                참가자 관리
            </a>

            <a th:href="@{/admin/schedules}"
               class="secondary-link-button">
                일정 목록
            </a>

            <a th:href="@{/admin/schedules/calendar}"
               class="secondary-link-button">
                달력 보기
            </a>

        </nav>

        <a th:href="@{/admin/logout}"
           class="back-link admin-hub-logout">
            로그아웃
        </a>

    </section>
</main>

</body>
</html>
