<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="page-container">
    <section class="card form-card">
        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>
            <h1 class="card-title">참가자 등록</h1>
            <p class="card-description">참가자 정보를 입력하고 로그인 계정을 만듭니다.</p>
        </div>
        <form class="login-form" th:action="@{/admin/members}" th:object="${memberCreateForm}" method="post">
            <div class="form-group">
                <label class="form-label" for="groupNo">그룹</label>
                <select class="form-input" id="groupNo" th:field="*{groupNo}" required>
                    <option value="">그룹 선택</option>
                    <option value="1">1그룹</option>
                    <option value="2">2그룹</option>
                    <option value="3">3그룹</option>
                </select>
                <p class="error-message" th:if="${#fields.hasErrors('groupNo')}" th:errors="*{groupNo}"></p>
            </div>
            <div class="form-group">
                <label class="form-label" for="loginId">로그인 아이디</label>
                <input class="form-input" id="loginId" type="text" th:field="*{loginId}" autocomplete="off" required>
                <p class="error-message" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">초기 비밀번호</label>
                <input class="form-input" id="password" type="password" th:field="*{password}" autocomplete="new-password" required>
                <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="form-group">
                <label class="form-label" for="name">이름</label>
                <input class="form-input" id="name" type="text" th:field="*{name}">
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">전화번호</label>
                <input class="form-input" id="phone" type="tel" th:field="*{phone}" placeholder="010-1234-5678" inputmode="numeric">
            </div>
            <button class="primary-button" type="submit">참가자 등록</button>
        </form>
        <a class="back-link" th:href="@{/admin/members}">참가자 목록으로</a>
    </section>
</main>
</body>
</html>
