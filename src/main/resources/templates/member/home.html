<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>참가자 일정</title>

    <!-- FullCalendar 전체 기능 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>

    <!-- FullCalendar 테마 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/global.js"></script>

    <!-- FullCalendar 한국어 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/locales/ko/global.js"></script>

    <!-- FullCalendar 구조 및 테마 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/theme.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/palettes/purple.css">

    <!-- 프로젝트 공통 CSS는 가장 마지막 -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="dashboard-body">

<header class="dashboard-header">
    <div class="dashboard-header-inner">

        <div>
            <p class="dashboard-eyebrow">
                Schedule Management
            </p>

            <h1 class="dashboard-title">
                일정 관리 시스템
            </h1>
        </div>

        <div class="dashboard-user">

            <div class="user-information">
                <strong>참가자</strong>
                <span>나의 일정을 확인해 주세요.</span>
            </div>

            <a class="logout-link"
               th:href="@{/member/logout}">
                로그아웃
            </a>

        </div>
    </div>
</header>

<main class="dashboard-container">

    <!-- ================================
         FullCalendar
    ================================= -->
    <section class="calendar-section">

        <div class="section-heading">
            <div>
                <p class="section-label">
                    MY CALENDAR
                </p>

                <h2 class="section-title">
                    나의 달력
                </h2>
            </div>
        </div>

        <div class="calendar-card full-calendar-card">
            <div id="calendar"></div>
        </div>

    </section>


    <!-- ================================
         FullCalendar에 전달할 DB 일정 데이터

         화면에는 보이지 않고,
         아래 JavaScript에서 읽어서 사용한다.
    ================================= -->
    <div id="schedule-data" hidden>

        <div class="schedule-data-item"
             th:each="schedule : ${schedules}"
             th:attr="
                data-id=${schedule.scheduleId},
                data-date=${schedule.scheduleDate},
                data-course=${schedule.course},
                data-group-no=${schedule.member.groupNo},
                data-weather=${schedule.weather}">
        </div>

    </div>


    <!-- ================================
     선택한 일정 상세
================================= -->
    <section class="schedule-detail-card">

        <div class="schedule-detail-header">

            <div>

                <p class="section-label">
                    SELECTED SCHEDULE
                </p>

                <h2
                        id="selected-date-title"
                        class="schedule-detail-title">

                    날짜를 선택해 주세요.

                </h2>

            </div>

            <span
                    id="selected-course"
                    class="course-badge">

            -

        </span>

        </div>

        <div class="schedule-summary">

            <div class="schedule-summary-item">

                <span>그룹</span>

                <strong id="selected-group">
                    -
                </strong>

            </div>

            <div class="schedule-summary-item">

                <span>날씨</span>

                <strong id="selected-weather">
                    -
                </strong>

            </div>

        </div>

        <div
                id="selected-spots"
                class="schedule-list">

            <!--
                여기에 스팟 목록이
                JavaScript로 들어갈 예정
            -->

        </div>

    </section>

</main>


<!-- ================================
     FullCalendar 실행
================================= -->
<script>
    document.addEventListener("DOMContentLoaded", function () {

        /*
         * FullCalendar가 출력될 HTML 요소
         */
        const calendarElement =
            document.getElementById("calendar");


        /*
         * 선택한 일정을 화면에 표시할 HTML 요소
         */
        const selectedDateTitle =
            document.getElementById("selected-date-title");


        const selectedCourse =
            document.getElementById("selected-course");


        const selectedGroup =
            document.getElementById("selected-group");


        const selectedWeather =
            document.getElementById("selected-weather");


        const selectedSpots =
            document.getElementById("selected-spots");


        /*
         * Thymeleaf가 DB 일정마다 생성한
         * 숨겨진 HTML 요소들을 모두 가져온다.
         */
        const scheduleItems =
            document.querySelectorAll(".schedule-data-item");


        /*
         * HTML의 data 속성을
         * FullCalendar 일정 객체 배열로 변환한다.
         *
         * 변환 결과 예시:
         *
         * [
         *     {
         *         id: "1",
         *         title: "코스 A",
         *         start: "2026-08-14",
         *         allDay: true
         *     }
         * ]
         */
        const calendarEvents =
            Array.from(scheduleItems).map(function (scheduleItem) {

                return {
                    id: scheduleItem.dataset.id,
                    title: `코스 ${scheduleItem.dataset.course}`,
                    start: scheduleItem.dataset.date,
                    allDay: true
                };

            });


        /*
         * 날짜 클릭 시 사용할
         * Schedule 목록
         */
        const schedules =
            Array.from(scheduleItems).map(function (scheduleItem) {

                return {
                    id: scheduleItem.dataset.id,
                    date: scheduleItem.dataset.date,
                    course: scheduleItem.dataset.course,
                    groupNo: scheduleItem.dataset.groupNo,
                    weather: scheduleItem.dataset.weather
                };

            });


        /*
         * FullCalendar 객체 생성
         */
        const calendar =
            new FullCalendar.Calendar(calendarElement, {

                /*
                 * 월간 달력 화면
                 */
                initialView: "dayGridMonth",

                /*
                 * 현재 날짜가 속한 달부터 시작
                 */
                initialDate: new Date(),

                /*
                 * 한국어 적용
                 */
                locale: "ko",

                /*
                 * 달력 상단 메뉴
                 *
                 * 왼쪽: 이전, 다음, 오늘 버튼
                 * 가운데: 현재 연도와 월
                 * 오른쪽: 표시하지 않음
                 */
                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: ""
                },

                /*
                 * 오늘 버튼 한글 표시
                 */
                buttonText: {
                    today: "오늘"
                },

                /*
                 * 일요일부터 시작
                 */
                firstDay: 0,

                /*
                 * DB에서 조회한 일정 전달
                 */
                events: calendarEvents,

                /*
                 * 일정이 하루에 많으면
                 * +몇 개 형태로 줄여서 표시
                 */
                dayMaxEvents: true,

                /*
                 * 일정 시간이 없는 종일 일정이므로
                 * 시간 텍스트는 숨긴다.
                 */
                displayEventTime: false,

                /*
                 * 내용에 맞게 달력 높이 자동 조절
                 */
                height: "auto",


                dateClick: function (info) {

                    /*
                     * 클릭한 날짜에 해당하는 일정 찾기
                     *
                     * 여기서는 상세정보를 사용하려는 게 아니라
                     * 백엔드에 요청할 scheduleId를 알아내기 위해 찾는다.
                     */
                    const selectedSchedule =
                        schedules.find(function (schedule) {
                            return schedule.date === info.dateStr;
                        });


                    /*
                     * 해당 날짜에 일정이 없는 경우
                     */
                    if (selectedSchedule === undefined) {

                        selectedDateTitle.textContent =
                            "해당 날짜에는 일정이 없습니다.";

                        selectedCourse.textContent = "-";
                        selectedGroup.textContent = "-";
                        selectedWeather.textContent = "-";
                        selectedSpots.innerHTML = "";

                        return;
                    }


                    /*
                     * 일정이 있다면 scheduleId를 이용해
                     * 백엔드 API에 상세정보를 요청한다.
                     */
                    fetch(`/member/api/schedules/${selectedSchedule.id}`)

                        /*
                         * 서버의 응답을 확인한다.
                         */
                        .then(function (response) {

                            if (!response.ok) {
                                throw new Error(
                                    "일정 상세정보를 불러올 수 없습니다."
                                );
                            }

                            /*
                             * JSON 응답을 JavaScript 객체로 변환
                             */
                            return response.json();
                        })


                        /*
                         * 백엔드에서 받은 일정 상세정보
                         */
                        .then(function (scheduleDetail) {

                            console.log(scheduleDetail);


                            /*
                             * 일정 기본정보 출력
                             */
                            selectedDateTitle.textContent =
                                scheduleDetail.scheduleDate;

                            selectedCourse.textContent =
                                "코스 " + scheduleDetail.course;

                            selectedGroup.textContent =
                                scheduleDetail.groupNo + "그룹";

                            selectedWeather.textContent =
                                scheduleDetail.weather
                                    ? scheduleDetail.weather
                                    : "-";


                            /*
                             * 기존에 표시된 스팟 목록을 비운다.
                             */
                            selectedSpots.innerHTML = "";


                            /*
                             * 백엔드에서 받은 스팟 목록을
                             * 하나씩 화면에 출력한다.
                             */
                            scheduleDetail.spots.forEach(function (spot) {

                                const spotItem =
                                    document.createElement("article");

                                spotItem.classList.add("schedule-item");


                                const sequenceElement =
                                    document.createElement("span");

                                sequenceElement.classList.add(
                                    "schedule-sequence"
                                );

                                sequenceElement.textContent =
                                    spot.sequence;


                                const spotInformation =
                                    document.createElement("div");


                                const timeElement =
                                    document.createElement("strong");

                                timeElement.classList.add(
                                    "schedule-time"
                                );

                                timeElement.textContent =
                                    spot.startTime;


                                const spotElement =
                                    document.createElement("p");

                                spotElement.classList.add(
                                    "schedule-spot"
                                );

                                spotElement.textContent =
                                    "HS" + spot.spotNo;


                                spotInformation.appendChild(
                                    timeElement
                                );

                                spotInformation.appendChild(
                                    spotElement
                                );

                                spotItem.appendChild(
                                    sequenceElement
                                );

                                spotItem.appendChild(
                                    spotInformation
                                );

                                selectedSpots.appendChild(
                                    spotItem
                                );
                            });
                        })


                        /*
                         * API 호출 실패 시
                         */
                        .catch(function (error) {

                            console.error(error);

                            selectedDateTitle.textContent =
                                "일정 정보를 불러오지 못했습니다.";

                            selectedCourse.textContent = "-";
                            selectedGroup.textContent = "-";
                            selectedWeather.textContent = "-";
                            selectedSpots.innerHTML = "";
                        });
                }
            });

        /*
         * 화면에 달력 출력
         */
        calendar.render();
    });
</script>

</body>
</html>
