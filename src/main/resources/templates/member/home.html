<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>참가자 일정</title>

    <!-- FullCalendar 전체 기능 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>

    <!-- FullCalendar 테마 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/global.js"></script>

    <!-- FullCalendar 한국어 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/locales/ko/global.js"></script>

    <!-- FullCalendar 구조 및 테마 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/theme.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/palettes/purple.css">

    <!-- 프로젝트 공통 CSS는 가장 마지막 -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="dashboard-body">

<header class="dashboard-header">
    <div class="dashboard-header-inner">

        <div>
            <p class="dashboard-eyebrow">
                Schedule Management
            </p>

            <h1 class="dashboard-title">
                일정 관리 시스템
            </h1>
        </div>

        <div class="dashboard-user">

            <div class="user-information">
                <strong>참가자</strong>
                <span>나의 일정을 확인해 주세요.</span>
            </div>

            <a class="logout-link"
               th:href="@{/member/logout}">
                로그아웃
            </a>

        </div>
    </div>
</header>

<main class="dashboard-container">

    <!-- ================================
         FullCalendar
    ================================= -->
    <section class="calendar-section">

        <div class="section-heading">
            <div>
                <p class="section-label">
                    MY CALENDAR
                </p>

                <h2 class="section-title">
                    나의 달력
                </h2>
            </div>
        </div>

        <div class="calendar-card full-calendar-card">
            <div id="calendar"></div>
        </div>

    </section>


    <!-- ================================
         FullCalendar에 전달할 DB 일정 데이터

         화면에는 보이지 않고,
         아래 JavaScript에서 읽어서 사용한다.
    ================================= -->
    <div id="schedule-data" hidden>

        <div class="schedule-data-item"
             th:each="schedule : ${schedules}"
             th:attr="
                data-id=${schedule.scheduleId},
                data-date=${schedule.scheduleDate},
                data-course=${schedule.course}">
        </div>

    </div>


    <!-- ================================
         실제 DB에서 조회한 참가자 본인 일정 목록
    ================================= -->
    <section class="member-schedule-section">

        <div class="section-heading">
            <div>
                <p class="section-label">
                    MY SCHEDULE
                </p>

                <h2 class="section-title">
                    내 일정 목록
                </h2>
            </div>
        </div>


        <!-- 일정이 있을 때 -->
        <div class="member-schedule-list"
             th:if="${!#lists.isEmpty(schedules)}">

            <article class="member-schedule-card"
                     th:each="schedule : ${schedules}">

                <div class="member-schedule-header">

                    <strong class="member-schedule-date"
                            th:text="${schedule.scheduleDate}">
                    </strong>

                    <span class="course-badge"
                          th:text="|코스 ${schedule.course}|">
                    </span>

                </div>

                <div class="member-schedule-information">

                    <div>
                        <span>그룹</span>

                        <strong th:text="|${schedule.member.group}그룹|">
                        </strong>
                    </div>

                    <div>
                        <span>날씨</span>

                        <strong th:text="${schedule.weather != null
                            ? schedule.weather
                            : '-'}">
                        </strong>
                    </div>

                </div>

            </article>

        </div>


        <!-- 일정이 없을 때 -->
        <p class="empty-message"
           th:if="${#lists.isEmpty(schedules)}">
            등록된 일정이 없습니다.
        </p>

    </section>

</main>


<!-- ================================
     FullCalendar 실행
================================= -->
<script>
    document.addEventListener("DOMContentLoaded", function () {

        /*
         * FullCalendar가 출력될 HTML 요소
         */
        const calendarElement =
            document.getElementById("calendar");


        /*
         * Thymeleaf가 DB 일정마다 생성한
         * 숨겨진 HTML 요소들을 모두 가져온다.
         */
        const scheduleItems =
            document.querySelectorAll(".schedule-data-item");


        /*
         * HTML의 data 속성을
         * FullCalendar 일정 객체 배열로 변환한다.
         *
         * 변환 결과 예시:
         *
         * [
         *     {
         *         id: "1",
         *         title: "코스 A",
         *         start: "2026-08-14",
         *         allDay: true
         *     }
         * ]
         */
        const calendarEvents =
            Array.from(scheduleItems).map(function (scheduleItem) {

                return {
                    id: scheduleItem.dataset.id,
                    title: `코스 ${scheduleItem.dataset.course}`,
                    start: scheduleItem.dataset.date,
                    allDay: true
                };

            });


        /*
         * FullCalendar 객체 생성
         */
        const calendar =
            new FullCalendar.Calendar(calendarElement, {

                /*
                 * 월간 달력 화면
                 */
                initialView: "dayGridMonth",

                /*
                 * 현재 날짜가 속한 달부터 시작
                 */
                initialDate: new Date(),

                /*
                 * 한국어 적용
                 */
                locale: "ko",

                /*
                 * 달력 상단 메뉴
                 *
                 * 왼쪽: 이전, 다음, 오늘 버튼
                 * 가운데: 현재 연도와 월
                 * 오른쪽: 표시하지 않음
                 */
                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: ""
                },

                /*
                 * 오늘 버튼 한글 표시
                 */
                buttonText: {
                    today: "오늘"
                },

                /*
                 * 일요일부터 시작
                 */
                firstDay: 0,

                /*
                 * DB에서 조회한 일정 전달
                 */
                events: calendarEvents,

                /*
                 * 일정이 하루에 많으면
                 * +몇 개 형태로 줄여서 표시
                 */
                dayMaxEvents: true,

                /*
                 * 일정 시간이 없는 종일 일정이므로
                 * 시간 텍스트는 숨긴다.
                 */
                displayEventTime: false,

                /*
                 * 내용에 맞게 달력 높이 자동 조절
                 */
                height: "auto"
            });


        /*
         * 화면에 달력 출력
         */
        calendar.render();

    });
</script>

</body>
</html>
