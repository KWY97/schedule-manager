spring:
  application:
    name: manage

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

kakao:
  maps:
    javascript-key: ${KAKAO_MAPS_JAVASCRIPT_KEY}

server:
  port: ${PORT:8080}